name: Technical checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jagjeet.work.16_National_Institute_of_Technology_Agartala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node --check dist/app.js
      - run: node --check dist/model.js
      - run: node check-model.cjs
      - run: python verify-data.py
      - run: python -m py_compile train.py

